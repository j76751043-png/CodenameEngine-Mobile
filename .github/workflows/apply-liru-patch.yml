name: Apply Liru Patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Apply Liru Patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Adds what the Liru mod needs: FunkinCursor, SelectableManager, ISelectable
      # and cursor support inside FunkinSprite. Nothing else in the engine is touched.
      - name: Apply patch
        run: |
          echo "" | base64 -d | tar xz -C .
          python3 liru_patch/patch_funkinsprite.py
          rm -rf liru_patch

      - name: Commit and push
        run: |
          git config user.name "liru-patch"
          git config user.email "liru-patch@users.noreply.github.com"
          git add -A
          git commit -m "Add Liru mod support (FunkinCursor, SelectableManager, ISelectable)" || echo "Nothing to commit"
          git push
