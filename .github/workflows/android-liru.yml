name: Android Build (Liru)
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      # Builds the exact mobile-v2 version of the engine, regardless of what your fork contains
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: ArkoseLabsOfficial/CodenameEngine-Mobile
          ref: mobile-v2
          fetch-depth: 0

      # Adds what the Liru mod needs: FunkinCursor, SelectableManager, ISelectable
      # and cursor support inside FunkinSprite. Nothing else in the engine is touched.
      - name: Apply Liru patch
        run: |
          echo "" | base64 -d | tar xz -C .
          python3 liru_patch/patch_funkinsprite.py
          python3 liru_patch/patch_engine.py

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      # The libraries are downloaded fresh every time, and newer versions break the app on phones.
      # Roll every one of them back to the last commit made before the mobile-v2 release (21 Jul 2026).
      - name: Pin libraries to their July 2026 versions
        run: |
          for d in .haxelib/*/git; do
            [ -d "$d/.git" ] || continue
            git -C "$d" fetch --unshallow --quiet 2>/dev/null || true
            c=$(git -C "$d" rev-list -1 --before="2026-07-21T08:00:00Z" HEAD 2>/dev/null || true)
            if [ -n "$c" ]; then
              git -C "$d" checkout -q -f "$c"
              git -C "$d" submodule update --init --recursive --quiet 2>/dev/null || true
              echo "$d -> $c ($(git -C "$d" log -1 --format=%cd "$c"))"
            else
              echo "$d: no commit before that date, left as is"
            fi
          done

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git
      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android Liru
          path: export/release/android/bin/app/build/outputs/apk/release/*
